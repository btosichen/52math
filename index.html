        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }

        // --- 資料設定 ---

        const CONCEPTS = [
          {
            id: 1,
            title: "重點 1：什麼是體積？",
            desc: "體積就是物體「佔了多少空間」。",
            unit: ["小物品 → 立方公分 (cm³)", "大空間 → 立方公尺 (m³)"],
            memory: "⚡ 超強記憶：體積就是「佔位子」！胖子佔的體積大，瘦子佔的體積小。",
            type: "stack"

          {
            id: 2,
            title: "重點 2：長方體的體積",
            desc: "長方體體積 ＝ 長 × 寬 × 高",
            memory: "⚡ 超強記憶：長、寬、高，三個好朋友乘在一起！",
            type: "prism"
          },
          {
            id: 3,
            title: "重點 3：正方體的體積",
            desc: "正方體體積 ＝ 邊長 × 邊長 × 邊長",
            memory: "⚡ 超強記憶：正方體是「完美寶寶」，長寬高都一樣，邊長連乘三次！",
            type: "cube"
          },
          {
            id: 4,
            title: "重點 4：1 立方公尺的量感",
            desc: "1 m³ = 1,000,000 cm³。它是邊長 1 公尺的正方體。",
            memory: "⚡ 超強記憶：1 後面跟著 6 個 0 (百萬)！想像把一個小朋友關進大箱子，那個箱子大約就是 1 立方公尺。",
            type: "sense"
          },
          {
            id: 5,
            title: "重點 5：換算超強記憶法",
            desc: "1 立方公尺到底等於幾立方公分？\n不用死背，用「6 個 0」大法！",
            memory: "⚡ 超強記憶：\n大單位(m³) 變 小單位(cm³) → 加上 6 個 0 (乘一百萬)\n小單位(cm³) 變 大單位(m³) → 劃掉 6 個 0 (除一百萬)\n口訣：「一百萬，六個蛋(0)！」",
            type: "conversion"
          },
          {
            id: 6,
            title: "重點 6：體積單位的選擇",
            desc: "不用亂換單位，只要「選對」。小用 cm³，大用 m³。",

            desc: "策略：切開相加，或補滿相減。",
            memory: "⚡ 超強記憶：遇到怪形狀，「切切切」或「補補補」！\n例如：樓梯形狀用「切」的，缺角的盒子用「補」成完整的再減掉。",
            type: "composite"
          }
        ];

        const QUESTIONS = [
          // 原有題目 (1-20)
          { id: 1, type: "tf", q: "體積是用來表示物體佔空間的大小。", ans: true, hint: "沒錯，這就是體積的定義！" },
          { id: 2, type: "tf", q: "長方體只要知道長和寬就能算體積。", ans: false, hint: "還少了一個「高」喔！" },
          { id: 3, type: "tf", q: "正方體的三個邊長都一樣。", ans: true, hint: "是的，長=寬=高。" },
          { id: 4, type: "tf", q: "1 立方公尺比 1 立方公分小。", ans: false, hint: "1 立方公尺可是有一百萬個 1 立方公分那麼多！" },
          { id: 5, type: "tf", q: "鉛筆盒適合用立方公尺表示體積。", ans: false, hint: "鉛筆盒小小的，用立方公分 (cm³) 比較適合。" },
          { id: 6, type: "tf", q: "1 立方公尺等於 1000000 立方公分。", ans: true, hint: "正確！100 × 100 × 100 = 1,000,000。" },
          { id: 7, type: "tf", q: "箱子擺放方向不同，體積可能會變。", ans: false, hint: "體積是不會變的，只是長寬高看起來位置換了。" },
          { id: 8, type: "tf", q: "複合形體可以切開來算體積。", ans: true, hint: "這是一個很好的解題策略！" },
          { id: 9, type: "mc", q: "下列哪一個最適合用「立方公尺」？", options: ["A. 橡皮擦", "B. 鉛筆盒", "C. 教室", "D. 杯子"], ans: "C", hint: "教室很大，人可以走進去，用 m³。" },
          { id: 10, type: "mc", q: "長 5 cm、寬 4 cm、高 3 cm 的盒子，體積是多少？", options: ["A. 12", "B. 20", "C. 60", "D. 120"], ans: "C", hint: "5 × 4 × 3 = 60" },
          { id: 11, type: "mc", q: "邊長 4 cm 的正方體，體積是多少？", options: ["A. 12", "B. 16", "C. 64", "D. 48"], optionsVal: ["A", "B", "C", "D"], ans: "C", hint: "4 × 4 × 4 = 64" },
          { id: 12, type: "mc", q: "下列哪一個體積最大？", options: ["A. 10×10×1 (=100)", "B. 5×5×5 (=125)", "C. 20×2×1 (=40)", "D. 8×3×2 (=48)"], ans: "B", hint: "算算看：B 是 125，最大。" },
          { id: 13, type: "mc", q: "1 m³ = ? cm³", options: ["A. 100", "B. 10000", "C. 1000000", "D. 10"], ans: "C", hint: "記得 6 個 0 喔！" },
          { id: 14, type: "tf", q: "計算體積時，單位如果不一樣，可以直接相乘。", ans: false, hint: "不行！要先換成相同單位才能計算。" },
          { id: 15, type: "mc", q: "一個正方體邊長變為原來的 2 倍，體積會變幾倍？", options: ["A. 2倍", "B. 4倍", "C. 6倍", "D. 8倍"], ans: "D", hint: "2 × 2 × 2 = 8 倍！" },
          { id: 16, type: "mc", q: "大卡車的貨櫃體積大約是？", options: ["A. 30 cm³", "B. 30 m³", "C. 3000 cm³", "D. 3 m³"], ans: "B", hint: "貨櫃很大，用 m³，且通常比 3 m³ 大很多。" },
          { id: 17, type: "tf", q: "把一塊長方體黏土捏成球形，體積會改變。", ans: false, hint: "形狀改變，但佔的空間量（體積）不變。" },
          { id: 18, type: "mc", q: "長 100cm, 寬 100cm, 高 100cm 的正方體，體積是？", options: ["A. 1 cm³", "B. 1 m³", "C. 100 m³", "D. 10 m³"], ans: "B", hint: "100cm = 1m，所以是 1 m³。" },
          { id: 19, type: "mc", q: "求複合圖形體積時，哪種方法是錯誤的？", options: ["A. 切割成兩個長方體", "B. 補成大長方體再扣除", "C. 直接把所有邊長加起來", "D. 分塊計算再相加"], ans: "C", hint: "體積是乘法概念，不是邊長相加喔。" },
          { id: 20, type: "tf", q: "體積越大的物體，重量一定越重。", ans: false, hint: "不一定喔！一大團棉花可能比一小塊鐵還輕。" },
          // 換算題目 (21-30)
          { id: 21, type: "mc", q: "2 立方公尺 = （ ）立方公分？", options: ["A. 200", "B. 20000", "C. 2000000", "D. 200000"], ans: "C", hint: "1 m³ = 1,000,000 cm³，所以 2 m³ 就是 200 萬。" },
          { id: 22, type: "mc", q: "12 立方公尺 = （ ）立方公分？", options: ["A. 12000000", "B. 120000", "C. 1200", "D. 1200000"], ans: "A", hint: "12 後面補 6 個 0，就是 1200 萬。" },
          { id: 23, type: "mc", q: "5000000 立方公分 = （ ）立方公尺？", options: ["A. 50", "B. 500", "C. 0.5", "D. 5"], ans: "D", hint: "劃掉 6 個 0：5,000,000 → 5。" },
          { id: 24, type: "mc", q: "玉晴有一個邊長 2 公尺的正方體，體積是多少立方公分？", options: ["A. 800", "B. 8000000", "C. 6000000", "D. 80000"], ans: "B", hint: "2公尺×2公尺×2公尺 = 8立方公尺 = 8,000,000立方公分。" },
          { id: 25, type: "mc", q: "10 立方公尺 = （ ）立方公分？", options: ["A. 10000000", "B. 1000000", "C. 100000", "D. 1000"], ans: "A", hint: "是 1000 萬喔！(1 後面有 7 個 0)。" },
          { id: 26, type: "mc", q: "40000000 立方公分 = （ ）立方公尺？", options: ["A. 400", "B. 40", "C. 4", "D. 4000"], ans: "B", hint: "4000 萬劃掉 6 個 0，剩下 40。" },
          { id: 27, type: "mc", q: "3 立方公尺 和 500000 立方公分 合起來是多少立方公分？", options: ["A. 350000", "B. 800000", "C. 3500000", "D. 3050000"], ans: "C", hint: "3 m³ = 3,000,000，加上 500,000 等於 3,500,000。" },
          { id: 28, type: "mc", q: "470000000 立方公分 = （ ）立方公尺？", options: ["A. 47", "B. 470", "C. 4700", "D. 4.7"], ans: "B", hint: "從後面數 6 個 0 劃掉：470,000,000。" },
          { id: 29, type: "mc", q: "長 5 公尺、寬 4 公尺、高 2 公尺的長方體，體積是多少立方公分？", options: ["A. 40", "B. 400000", "C. 40000000", "D. 4000000"], ans: "C", hint: "5×4×2=40(m³)，換算成 cm³ 要加 6 個 0 (4000 萬)。" },
          { id: 30, type: "mc", q: "920000000 立方公分 = （ ）立方公尺？", options: ["A. 92", "B. 9200", "C. 920", "D. 9.2"], ans: "C", hint: "9 億 2 千萬立方公分 = 920 立方公尺。" }
        ];

        // --- 互動組件 ---
        const InteractiveStack = () => {
          const [count, setCount] = useState(1);
          return (
            <div className="flex flex-col items-center bg-blue-50 p-8 rounded-xl w-full">
              <div className="mb-6 text-2xl font-bold text-blue-800">目前堆疊：{count} 個小方塊</div>
              <div className="flex flex-wrap justify-center w-80 h-40 content-end gap-1 mb-6">
                {Array.from({ length: count }).map((_, i) => (
                  <div key={i} className="relative w-14 h-14 bg-orange-400 border-2 border-orange-600 rounded shadow-md animate-bounce-short">
                    {i === 0 && count === 1 && (
                        <div className="absolute -top-8 left-0 w-full text-center text-sm text-gray-600 font-bold whitespace-nowrap">
                           長寬高1cm
                        </div>
                    )}
                     <div className="absolute inset-0 flex items-center justify-center text-xs text-orange-900 opacity-60 font-mono">1cm³</div>
                  </div>
                ))}
              </div>
              <div className="flex gap-6">
                <button onClick={() => setCount(c => Math.max(1, c - 1))} className="w-16 h-16 flex items-center justify-center bg-gray-300 rounded-full font-bold text-3xl hover:bg-gray-400 transition">-</button>
                <button onClick={() => setCount(c => Math.min(12, c + 1))} className="px-8 py-4 bg-blue-600 text-white rounded-full font-bold text-xl shadow-lg hover:bg-blue-700 hover:scale-105 transition">
                  + 堆疊方塊
                </button>
              </div>
              <p className="mt-4 text-lg text-gray-700">每個小方塊都是 1cm × 1cm × 1cm</p>
              <p className="text-xl font-bold text-blue-700 mt-2">總體積 = {count} cm³</p>
            </div>
          );
        };

        const InteractivePrism = () => {
          const [l, setL] = useState(3);
          const [w, setW] = useState(2);
          const [h, setH] = useState(2);
          const scale = 40; const depthX = 20; const depthY = -20; const startX = 60; const startY = 280; 
          const fW = l * scale; const fH = h * scale; const dX = w * depthX; const dY = w * depthY;
          const p1 = { x: startX, y: startY }; const p2 = { x: startX + fW, y: startY }; const p3 = { x: startX + fW, y: startY - fH }; const p4 = { x: startX, y: startY - fH };
          const p5 = { x: startX + dX, y: startY + dY }; const p6 = { x: startX + fW + dX, y: startY + dY }; const p7 = { x: startX + fW + dX, y: startY - fH + dY }; const p8 = { x: startX + dX, y: startY - fH + dY };

          return (
            <div className="flex flex-col items-center bg-green-50 p-8 rounded-xl w-full">
              <div className="relative mb-6 flex justify-center items-center w-full" style={{ height: '350px' }}>
                <svg width="500" height="350" className="overflow-visible">
                    <defs>
                        <linearGradient id="frontGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#86efac" />
                            <stop offset="100%" stopColor="#4ade80" />
                        </linearGradient>
                         <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stopColor="#dcfce7" />
                            <stop offset="100%" stopColor="#bbf7d0" />
                        </linearGradient>
                         <linearGradient id="sideGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stopColor="#4ade80" />
                            <stop offset="100%" stopColor="#22c55e" />
                        </linearGradient>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                          <path d="M0,0 L10,5 L0,10" fill="#374151" />
                        </marker>
                    </defs>
                    <path d={`M${p5.x},${p5.y} L${p6.x},${p6.y} L${p7.x},${p7.y} L${p8.x},${p8.y} Z`} fill="none" stroke="#cbd5e1" strokeDasharray="4" strokeWidth="2" />
                    <line x1={p1.x} y1={p1.y} x2={p5.x} y2={p5.y} stroke="#cbd5e1" strokeDasharray="4" strokeWidth="2"/>
                    <path d={`M${p2.x},${p2.y} L${p6.x},${p6.y} L${p7.x},${p7.y} L${p3.x},${p3.y} Z`} fill="url(#sideGrad)" stroke="#166534" strokeWidth="3" />

          const [showFeedback, setShowFeedback] = useState(false);
          const [currentAns, setCurrentAns] = useState(null);

          // 直接設定您提供的 GAS 網址作為預設值
          const [teacherUrl, setTeacherUrl] = useState("https://script.google.com/macros/s/AKfycbxr4w817Y7RjYRDFVKJtJiAdpLZTqWmSpJBHtP-GJqPaqnHj_PKczSkkYJZtM6JJ1E/exec"); 
          const [showSettings, setShowSettings] = useState(false);
          const [isSubmitting, setIsSubmitting] = useState(false);

          useEffect(() => {
            const saved = localStorage.getItem('volumeMasterUser');
            if (saved) {
              setUser(JSON.parse(saved));
            }
            const savedTeacherUrl = localStorage.getItem('volumeMasterTeacherUrl');
            if (savedTeacherUrl) {
                setTeacherUrl(savedTeacherUrl);
            }
          }, []);

          const saveUser = (newData) => {
            const updated = { ...user, ...newData };
            setUser(updated);
            localStorage.setItem('volumeMasterUser', JSON.stringify(updated));
          };

          const saveTeacherUrl = (url) => {
              setTeacherUrl(url);
              localStorage.setItem('volumeMasterTeacherUrl', url);
          }

          const startApp = () => {
            if (!tempName.trim()) return;
            saveUser({ name: tempName });
            setScreen('menu');
          };

          const submitQuiz = () => {
            const finalScore = Math.round((score / QUESTIONS.length) * 100);
            const record = {
              date: new Date().toLocaleString(),
              score: finalScore,
              correctCount: score,
              totalCount: QUESTIONS.length,
              details: answers
            };
            
            const newHistory = [record, ...user.history];
            saveUser({ history: newHistory });
            setScreen('report');
          };

          const handleAnswer = (option) => {
            if (showFeedback) return;
            
            const q = QUESTIONS[currentQ];
            let isCorrect = false;
            
            if (q.type === 'tf') isCorrect = (option === q.ans);
            if (q.type === 'mc') {
               const choiceLetter = option.charAt(0);
               isCorrect = (choiceLetter === q.ans);
            }

            setCurrentAns({ user: option, correct: isCorrect, hint: q.hint });
            setShowFeedback(true);
            if (isCorrect) setScore(s => s + 1);

            setAnswers([...answers, {
              id: q.id,
              q: q.q,
              userAns: typeof option === 'boolean' ? (option ? "O" : "X") : option,
              isCorrect
            }]);
          };

          const nextQuestion = () => {
            setShowFeedback(false);
            setCurrentAns(null);
            if (currentQ < QUESTIONS.length - 1) {
              setCurrentQ(prev => prev + 1);
            } else {
              submitQuiz();
            }
          };

          // GAS 提交邏輯
          const submitToGAS = async () => {
            if (!teacherUrl) return;
            setIsSubmitting(true);
            
            const latest = user.history[0] || {};
            const detailsStr = latest.details ? latest.details.map((a, i) => `${i+1}:${a.isCorrect ? 'O' : `X(${a.userAns})`}`).join(', ') : '無詳細資料';
            
            const payload = {
                name: user.name,
                score: latest.score,
                correctCount: latest.correctCount,
                totalCount: latest.totalCount,
                details: detailsStr
            };

            try {
                // 使用 no-cors 模式以避免跨域問題
                await fetch(teacherUrl, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                alert('✅ 成績已成功上傳給老師！');

                console.error('Upload Error:', error);

                                   <IconScissors className="mx-auto mb-4 text-red-500 w-16 h-16" />
                                   <p className="font-bold text-red-700 text-2xl mb-2">🔪 切割法</p>
                                   <p className="text-lg text-gray-600 my-4 leading-relaxed">把形狀切成好幾塊長方體，分別算出體積再加起來。</p>
                                   <div className="bg-white p-4 rounded-xl text-base text-left border border-red-100 shadow-sm text-gray-700">
                                     <strong className="text-red-600 block mb-1">舉例：樓梯形狀</strong>
                                     切成三塊像「階梯」一樣的長方體，算出每一階的體積，最後加總。
                                   </div>
                                </div>
                                <div className="bg-blue-50 p-8 rounded-2xl border-2 border-blue-200 flex-1 max-w-sm hover:shadow-lg transition">
                                   <IconLayers className="mx-auto mb-4 text-blue-500 w-16 h-16" />
                                   <p className="font-bold text-blue-700 text-2xl mb-2">🧱 填補法</p>
                                   <p className="text-lg text-gray-600 my-4 leading-relaxed">把空缺補起來變成一個大長方體，算出體積後再減掉補的部分。</p>
                                   <div className="bg-white p-4 rounded-xl text-base text-left border border-blue-100 shadow-sm text-gray-700">
                                     <strong className="text-blue-600 block mb-1">舉例：缺角的盒子</strong>
                                     先假裝它是完整的長方體算出大體積，再扣掉中間空心的體積。
                                   </div>
                                </div>
                             </div>
                          </div>
                        )}
                      </div>

                      <div className="bg-yellow-50 border-l-8 border-yellow-400 p-8 rounded-r-2xl shadow-sm">
                        <p className="text-yellow-900 font-bold text-2xl whitespace-pre-line leading-loose">{concept.memory}</p>
                      </div>
                      
                      {concept.type === 'cube' && (
                        <div className="mt-8 text-center">
                            <p className="text-3xl font-bold text-orange-600 bg-orange-50 inline-block px-8 py-4 rounded-2xl border-2 border-orange-200 shadow">
                                體積 = 邊長 × 邊長 × 邊長 = 3 × 3 × 3 = 27
                            </p>
                        </div>
                      )}
                    </div>

                    <div className="bg-gray-50 p-8 flex justify-between border-t border-gray-200">
                      <button 
                        onClick={() => setCurrentConcept(c => Math.max(0, c - 1))}
                        disabled={currentConcept === 0}
                        className="px-8 py-3 rounded-xl bg-white border-2 border-gray-300 text-xl font-bold text-gray-600 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition"
                      >
                        上一頁
                      </button>
                      <button 
                        onClick={() => {
                            if (currentConcept < CONCEPTS.length - 1) {
                                setCurrentConcept(c => c + 1);
                            } else {
                                setScreen('menu');
                            }
                        }}
                        className="px-8 py-3 rounded-xl bg-blue-600 text-white font-bold text-xl hover:bg-blue-700 shadow-lg hover:shadow-xl transition transform hover:-translate-y-1"
                      >
                        {currentConcept === CONCEPTS.length - 1 ? "完成學習" : "下一頁"}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          if (screen === 'quiz') {
            const q = QUESTIONS[currentQ];
            const progress = ((currentQ) / QUESTIONS.length) * 100;

            return (
              <div className="min-h-screen bg-indigo-50 flex flex-col">
                <div className="w-full bg-gray-200 h-3">
                  <div className="bg-indigo-500 h-3 transition-all duration-500" style={{ width: `${progress}%` }}></div>
                </div>
                
                <div className="flex-1 flex items-center justify-center p-8">
                  <div className="max-w-4xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden p-12 relative">
                    <div className="absolute top-8 right-8 text-indigo-200 font-bold text-5xl">
                      {currentQ + 1} <span className="text-2xl">/ {QUESTIONS.length}</span>
                    </div>

                    <h2 className="text-4xl font-bold text-gray-800 mb-12 pr-20 leading-relaxed">
                      {q.q}
                    </h2>

                    {!showFeedback ? (
                      <div className="grid gap-6">
                        {q.type === 'tf' ? (
                          <div className="flex gap-8 h-48">
                            <button onClick={() => handleAnswer(true)} className="flex-1 bg-green-50 hover:bg-green-100 text-green-600 rounded-3xl text-7xl font-bold flex items-center justify-center border-4 border-green-200 transition-transform hover:scale-105 shadow-md">O</button>
                            <button onClick={() => handleAnswer(false)} className="flex-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-3xl text-7xl font-bold flex items-center justify-center border-4 border-red-200 transition-transform hover:scale-105 shadow-md">X</button>
                          </div>
                        ) : (
                          <div className="grid grid-cols-1 gap-4">
                            {q.options.map((opt, idx) => (
                              <button 
                                key={idx} 
                                onClick={() => handleAnswer(opt)}
                                className="text-left p-6 rounded-2xl border-2 border-indigo-100 hover:bg-indigo-50 hover:border-indigo-400 text-2xl font-medium transition-all shadow-sm"
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="text-center animate-fade-in py-8">
                        <div className={`flex justify-center mb-6 ${currentAns.correct ? 'text-green-500' : 'text-red-500'}`}>
                          {currentAns.correct ? <IconCheck size={120} /> : <IconX size={120} />}
                        </div>
                        <h3 className={`text-4xl font-bold mb-4 ${currentAns.correct ? 'text-green-700' : 'text-red-700'}`}>
                          {currentAns.correct ? "答對了！" : "答錯囉！"}
                        </h3>
                        <div className="bg-gray-100 p-6 rounded-2xl text-gray-700 mb-10 text-2xl border border-gray-200">
                          💡 {currentAns.hint}
                        </div>
                        <button onClick={nextQuestion} className="px-12 py-4 bg-indigo-600 text-white rounded-full font-bold text-2xl hover:bg-indigo-700 shadow-xl hover:shadow-2xl transition-transform hover:-translate-y-1">
                          {currentQ < QUESTIONS.length - 1 ? "下一題" : "看成績"}
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            );
          }

          if (screen === 'report') {
            const latest = user.history[0] || {};
            
            return (
              <div className="min-h-screen bg-gray-50 p-8">
                <div className="max-w-4xl mx-auto bg-white rounded-[2rem] shadow-2xl overflow-hidden">
                  <div className="bg-purple-600 p-10 text-white text-center">
                    <h2 className="text-4xl font-bold mb-3">學習成績單</h2>
                    <p className="opacity-90 text-xl">姓名：{user.name}</p>
                  </div>

                  <div className="p-12">
                    <div className="text-center mb-12">
                      <div className="inline-block p-10 rounded-full bg-purple-50 border-8 border-purple-200 mb-6">
                        <span className="text-7xl font-bold text-purple-700">{latest.score}</span>
                        <span className="text-3xl text-purple-400"> 分</span>
                      </div>
                      <p className="text-2xl text-gray-600">
                        答對 {latest.correctCount} / {latest.totalCount} 題 ({latest.date})
                      </p>
                      <div className="mt-4 text-3xl font-bold text-purple-600">
                        {latest.score >= 90 ? "太強了！你是體積大師！🏆" : 
                         latest.score >= 60 ? "很棒喔！繼續加油！💪" : "別氣餒，再複習一次觀念吧！📚"}
                      </div>
                    </div>

                    <h3 className="text-2xl font-bold text-gray-700 mb-6 border-b pb-4">答題詳情</h3>
                    <div className="space-y-4 mb-10 max-h-80 overflow-y-auto pr-4">
                      {latest.details && latest.details.map((ans, i) => (
                        <div key={i} className={`flex justify-between items-center p-5 rounded-xl text-lg ${ans.isCorrect ? 'bg-green-50' : 'bg-red-50'}`}>
                          <div className="flex-1">
                            <span className="font-bold mr-4 text-gray-500">{i+1}.</span>
                            <span className="text-gray-800">{ans.q}</span>
                          </div>
                          <div className={`font-bold ml-6 text-2xl ${ans.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                            {ans.isCorrect ? "O" : "X"}
                          </div>
                        </div>
                      ))}
                    </div>

                    <h3 className="text-2xl font-bold text-gray-700 mb-4 border-b pb-4">📤 提交給老師</h3>
                    <p className="text-lg text-gray-500 mb-6">若老師有設定串接網址，點擊下方按鈕即可將成績自動填入並提交。</p>
                    
                    {teacherUrl ? (
                        <button onClick={submitToGAS} disabled={isSubmitting} className={`block w-full text-center text-white py-4 rounded-xl font-bold text-xl mb-6 shadow-md transition flex items-center justify-center gap-3 ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 hover:-translate-y-1'}`}>
                            {isSubmitting ? '正在上傳中...' : <><IconCloudUpload size={24}/> 上傳成績到 Google 試算表</>}
                        </button>
                    ) : (
                        <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-200 mb-6 text-yellow-800 text-center">
                            ⚠️ 老師尚未設定上傳連結，請手動告知老師分數。
                        </div>
                    )}

                    <textarea 
                      readOnly 
                      className="w-full p-5 bg-gray-100 rounded-xl border-2 border-gray-200 text-lg font-mono h-40 mb-8 focus:outline-none"
                      value={`【五下體積單元成績回報】\n姓名：${user.name}\n分數：${latest.score}\n時間：${latest.date}\n答對題數：${latest.correctCount}/${latest.totalCount}`}
                    />
                    
                    <div className="grid grid-cols-2 gap-6">
                      <button onClick={() => setScreen('menu')} className="py-4 border-2 border-gray-300 rounded-xl font-bold text-xl text-gray-600 hover:bg-gray-50 transition">
                        回主選單
                      </button>
                      <button onClick={() => {
                        setScore(0); setCurrentQ(0); setAnswers([]); setScreen('quiz');
                      }} className="py-4 bg-purple-600 text-white rounded-xl font-bold text-xl hover:bg-purple-700 shadow-lg transition">
                        再挑戰一次
                      </button>
                    </div>
                  </div>
                  {showSettings && <TeacherSettingsPanel />}
                </div>
              </div>
            );
          }

          return <div>Loading...</div>;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VolumeMasterClass />);
    </script>
</body>
</html>
